trigger:
  batch: false
  branches:
    include:
      - main

pool:
  name: Default
  demands: Agent.OS -equals Windows_NT

variables:
  - group: Nuget

steps:
  - pwsh: |
      Get-ChildItem -Path '$(Build.ArtifactStagingDirectory)' -Recurse -Include *.nupkg, *.snupkg | Remove-Item
      Get-ChildItem -Path '$(Build.SourcesDirectory)' -Recurse -Include *.nupkg, *.snupkg | Remove-Item
    displayName: Clear NuGet packages

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      projects: Kros.Utils.MsAccess.slnx
      arguments: --configuration Release

  - task: DotNetCoreCLI@2
    displayName: Test
    inputs:
      command: test
      projects: Kros.Utils.MsAccess.slnx
      publishTestResults: false
      arguments: --configuration Release --logger trx --results-directory "$(Common.TestResultsDirectory)"

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: VSTest
      testResultsFiles: '*.trx'
      searchFolder: $(Common.TestResultsDirectory)

  - task: CopyFiles@2
    displayName: Copy package files to staging folder
    inputs:
      Contents: |
        **/*.nupkg
        **/*.snupkg
      TargetFolder: $(Build.ArtifactStagingDirectory)
      FlattenFolders: true

  - pwsh: |
      dotnet nuget push --api-key $(nugetOrgApiKey) --source 'https://api.nuget.org/v3/index.json'  --skip-duplicate '$(Build.ArtifactStagingDirectory)/*.nupkg'
    displayName: Push to NuGet.org
