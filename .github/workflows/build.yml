name: Build

# The library targets .NET Framework 4.8 and its tests need the Microsoft ACE OLEDB provider
# (Access Database Engine), which is not available on GitHub-hosted runners. Therefore only the
# library is built and published here. Developers run the unit tests locally before merging.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/Kros.Utils.MsAccess.csproj --configuration Release

      - name: Collect packages
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $staging = Join-Path $env:RUNNER_TEMP 'packages'
          New-Item -ItemType Directory -Path $staging -Force | Out-Null
          Get-ChildItem -Path src -Recurse -Include *.nupkg, *.snupkg |
            Where-Object { $_.FullName -match '[\\/]bin[\\/]Release[\\/]' } |
            ForEach-Object {
              Write-Host "Collecting $($_.Name)"
              Copy-Item $_.FullName -Destination $staging
            }

      - name: Upload packages
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: packages
          path: ${{ runner.temp }}/packages/*
          if-no-files-found: error

  publish:
    name: Push to NuGet.org
    needs: build
    # Publish only from main, never from pull requests. Manual runs (workflow_dispatch) publish too,
    # but the nuget-org environment only allows deployments from main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: nuget-org
    permissions:
      contents: read
      id-token: write # allows GitHub to issue the OIDC token exchanged for a short-lived NuGet.org API key

    steps:
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          name: packages
          path: ${{ runner.temp }}/packages

      # Trusted Publishing: exchanges the GitHub OIDC token for a temporary (1 hour) NuGet.org API key.
      # Requires a Trusted Publishing policy on nuget.org for this repository and workflow file (build.yml).
      - name: NuGet.org login
        id: nuget-login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }} # nuget.org profile name of the account that owns the Trusted Publishing policy

      - name: Push to NuGet.org
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem (Join-Path $env:RUNNER_TEMP 'packages' '*.nupkg') | ForEach-Object {
            Write-Host "Pushing package $($_.Name)"
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source 'https://api.nuget.org/v3/index.json' --skip-duplicate
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
